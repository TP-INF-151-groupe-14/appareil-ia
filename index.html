<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appareil-IA - Groupe 14</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;margin:0;padding:20px}
.card{background:#1e293b;padding:20px;border-radius:15px;margin-top:20px}
button{background:#22c55e;color:white;border:none;padding:12px 20px;border-radius:8px;font-weight:bold;width:100%}
input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none}
h1{color:#22c55e}
</style>
</head>
<body>
<h1>📱 Appareil-IA</h1>
<p>Système d'échange d'appareils - Groupe 14</p>

<div class="card">
<h3>Ajouter un appareil</h3>
<input type="text" placeholder="Nom de l'appareil (ex: Tecno Spark 20)">
<select>
<option>Catégorie</option>
<option>Téléphone</option>
<option>Ordinateur</option>
<option>Tablette</option>
</select>
<input type="text" placeholder="État (ex: Bon état, 8/10)">
<button>Publier l'appareil</button>
</div>

<div class="card">
<h3>Appareils disponibles</h3>
<p>✅ Aucun appareil pour le moment - Soyez le premier à publier !</p>
<p><small>Branche: dev-franklin | Par: franklinkevis</small></p>
</div>

</body>
</html>
